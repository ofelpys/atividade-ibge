<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição no Evento</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main>
        <h1>Inscrição no Evento</h1>

        <img id="fotoCristiano" src="cristiano-ronaldo.jpg" alt="Cristiano Ronaldo comemorando um gol pelo Real Madrid">

        <form id="formInscricao">
            <label>Nome
                <input type="text" id="nome" required>
            </label>

            <label>E-mail
                <input type="email" id="email" required>
            </label>

            <label>Estado
                <select id="estado" required disabled>
                    <option value="">Carregando estados...</option>
                </select>
            </label>

            <label>Filtrar cidades
                <input type="text" id="filtroCidade" placeholder="Digite o nome da cidade" disabled>
            </label>

            <label>Cidade
                <select id="cidade" required disabled>
                    <option value="">Escolha um estado primeiro</option>
                </select>
            </label>



            <button type="submit">Inscrever</button>
        </form>

        <p id="qtdCidades"></p>
        <div id="resumo"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
